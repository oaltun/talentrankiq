[package]
name = "libtriqui-core"
version = "0.1.0"
description = "TalentRankIQ domain core: SQLite persistence with a read pool + single writer, shared by the Tauri GUI and the libtriqui-cli headless binary."
authors = ["oaltun"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "libtriqui_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

rusqlite = { version = "0.32", features = ["bundled"] }

libtriqui-client = { path = "../libtriqui-client" }
libconfigreader = { path = "../libconfigreader" }
libmodelcallerclient = { path = "../libmodelcallerclient", features = ["inprocess"] }
libtokenizer = { path = "../libtokenizer" }
