[workspace]
resolver = "2"
members = [
    "lib/libcv-core",
    "lib/libcv-quick",
    "lib/libcv-deep",
    "lib/libcv-match",
    "lib/libcv-store",
    "cli",
    "lib/libcv-pipeline",
    "lib/libcv-state",
    "lib/libcv-comparator-order",
    "lib/libtriqui-core",
    "lib/libtriqui-cli",
    "lib/libtriqui-client",
    "lib/libcli-client",
    "lib/libcli-client-types",
    "lib/libtriqui-license",
    "lib/libconfigreader",
    "lib/libcvparser",
    "lib/libembedrank",
    "lib/libcomparator",
    "lib/libmlxembed",
    "lib/libmodelcallerclient",
    "lib/libmodelstorage",
    "lib/libsyscap",
    "lib/libtokenizer",
    "lib/libmodelcaller",
    "lib/libmodeldownloader",
    "lib/libonnxwrapperrs",
    "lib/libbenchresults",
    "lib/libcvevidence",
]

[profile.dev]
debug = "line-tables-only"
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true

