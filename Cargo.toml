[workspace]
resolver = "2"
members = [
    "gui/src-tauri",
    "cli",
    "lib/libtriqui-core",
    "lib/libtriqui-cli",
    "lib/libtriqui-client",
    "lib/libcli-client",
    "lib/libcli-client-types",
    "lib/libtriqui-license",
    "lib/libconfigreader",
    "lib/libcvparser",
    "lib/libembedrank",
    "lib/libjudge",
    "lib/libmlxembed",
    "lib/libmodelcallerclient",
    "lib/libmodelstorage",
    "lib/libsyscap",
    "lib/libtokenizer",
    "lib/libmodelcaller",
    "lib/libmodeldownloader",
    "lib/libonnxwrapperrs",
    "lib/libbenchresults",
    "lib/libcvevidence",
]

[profile.dev]
debug = "line-tables-only"
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true

# esaxx-rs forces .static_crt(true) → /MT on Windows, which conflicts with the
# /MD used by every other C dependency in the graph (ort_sys, ...). Patch it
# locally so the gui's cdylib/dll links cleanly on Windows. A no-op elsewhere.
[patch.crates-io]
esaxx-rs = { path = "gui/src-tauri/patches/esaxx-rs" }
