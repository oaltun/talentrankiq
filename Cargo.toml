[workspace]
resolver = "2"
members = [
    "gui/src-tauri",
    "lib/libtriqui-core",
    "lib/libtriqui-cli",
    "lib/libtriqui-client",
    "lib/libtriqui-license",
    "lib/libconfigreader",
    "lib/libcvparser",
    "lib/libembedrank",
    "lib/libjudge",
    "lib/libmlxembed",
    "lib/libmodelcallerclient",
    "lib/libmodelstorage",
    "lib/libsyscap",
    "lib/libtokenizer",
    "lib/libmodelcaller",
    "lib/libmodeldownloader",
    "lib/libonnxwrapperrs",
    "lib/libbenchresults",
    "lib/libcvevidence",
]

[profile.dev]
debug = "line-tables-only"
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
