gui_embedders:
  - slug: harrier-oss-v1-0.6b-ONNX-q4
    name: Harrier 600M Q4
    memory_mb: 2200
    chunk_size: 1024
  - slug: harrier-oss-v1-270m-ONNX_model_q4f16
    name: Harrier 270M Q4F16
    memory_mb: 600
    default: true
    chunk_size: 1024

# gui judge stage artifacts
gui_judge_artifact:
  default: "gui/judges/harrier-600m-v1.json"
  harrier-oss-v1-270m-ONNX_model_q4f16: "gui/judges/harrier-270m-v1.json"

# Progressive-ranking cascade
cascade:
  scout_model: static-similarity-mrl-multilingual-v1
  scout_enabled: true
  scout_chunk_size: 512
  k1_embed_per_wave: 100
  k2_judge_per_wave: 50
  small_job_threshold: 300