    name: Harrier 270M MLX (Metal)
    memory_mb: 600
    chunk_size: 1024
  - slug: harrier-oss-v1-0.6b-ONNX-q4
    name: Harrier 600M ONNX
    memory_mb: 2200
    chunk_size: 1024
