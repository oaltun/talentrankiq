model_dir: "~/.cache/ik/models"
verbose: false
revision: main
gui_idle_unload_secs: 300

# Root folder for new jobs' default CV directories (each new job gets a fresh
# `<root>/job-N/cv` folder, created on disk and auto-import-watched while the
# job is open). Normally set from inside the app (Settings -> General -> CV
# directory), which overrides this key; this is only a fallback for a fresh
# install. `~` and relative paths resolve against this file. Unset = the
# platform Documents dir + `jobs` (e.g. ~/Documents/jobs).
# gui_cv_dir_root: "~/Documents/jobs"

# ONNX engine resource ceilings (modelcaller -> onnxwrapperrs, both
# in-process libraries). No hardcoded machine-size numbers: every knob is
# OPTIONAL and the `syscap` budget below derives the effective value from
# live capacity.
engine:
  # UNSET = derived from the libsyscap budget (capacity when idle, halved under
  # Polite, floored under Backoff/Hold). Never ONNX Runtime's every-core fallback.
  # intra_threads: 4
  # UNSET = derived (single-threaded dispatch). These small embedding models gain
  # nothing from node parallelism.
  # inter_threads: 1
  # UNSET = derived (follows the same budget). Bigger batches are SLOWER for
  # these bandwidth-bound embedders.
  # embed_batch: 8
  backend: auto

# System capability + live-load budget (lib/libsyscap): one policy the gui,
# bench, tests, and build tools consult to decide how much CPU/RAM they may use
# right now. Capacity counts every core; runtime consumers derive their knobs
# from it (engine ceilings can only lower).
syscap:
  on_battery_polite: true
  build_jobs: auto
  reserve_cores: 1
  reserve_core_frac: 0.10

# Default rubric weights (points) applied when a new job is created and to
# each newly added criterion.
rubric_defaults:
  ad_points: 50
  fb_job_points: 10
  fb_profile_points: 5
  criterion_points: 10

families:
  - family: static-similarity-mrl
    usage: plain
  - family: nomic-embed-text-v1
    usage: nomic-prefix
  - family: bge-small-en-v1.5
    usage: bge-prefix
  - family: multilingual-e5-large
    usage: e5-prefix
  - family: harrier-oss-v1
    usage: harrier-instruct
  - family: bge-reranker-v2-m3
    usage: plain-pair
  - family: jina-reranker-v1-tiny-en
    usage: plain-pair
  - family: granite-embedding-311m-multilingual-r2
    usage: plain
  - family: mlateon
    usage: colbert-prefix
  - family: qwen-instruct
    usage: extraction-json

models:

  - slug: nomic-embed-text-v1.5
    family: nomic-embed-text-v1
    kind: embedder
    dim: 768
    max_context_window: 2048
    source: hf:nomic-ai/nomic-embed-text-v1.5
    onnx_url: https://huggingface.co/nomic-ai/nomic-embed-text-v1.5/resolve/main/onnx/model.onnx

  - slug: bge-small-en-v1.5
    family: bge-small-en-v1.5
    kind: embedder
    dim: 384
    max_context_window: 512
    source: hf:Xenova/bge-small-en-v1.5
    onnx_url: https://huggingface.co/Xenova/bge-small-en-v1.5/resolve/main/onnx/model.onnx

  - slug: multilingual-e5-large_model_qint8_avx512_vnni
    family: multilingual-e5-large
    kind: embedder
    dim: 1024
    max_context_window: 512
    source: hf:Xenova/multilingual-e5-large
    onnx_url: https://huggingface.co/Xenova/multilingual-e5-large/resolve/main/onnx/model_quantized.onnx

  - slug: harrier-oss-v1-0.6b-ONNX-fp16
    family: harrier-oss-v1
    kind: embedder
    dim: 1024
    max_context_window: 32768
    source: hf:onnx-community/harrier-oss-v1-0.6b-ONNX
    onnx_url: https://huggingface.co/onnx-community/harrier-oss-v1-0.6b-ONNX/resolve/main/onnx/model_fp16.onnx

  - slug: harrier-oss-v1-0.6b-ONNX-q4
    family: harrier-oss-v1
    kind: embedder
    dim: 1024
    max_context_window: 32768
    source: hf:onnx-community/harrier-oss-v1-0.6b-ONNX
    onnx_url: https://huggingface.co/onnx-community/harrier-oss-v1-0.6b-ONNX/resolve/main/onnx/model_q4.onnx
    # Metal arm (design 15 §15.5.3): the same weights as an MLX-quantized
    # safetensors checkpoint. Used only when the active backend resolves to
    # `mlx`, so bench (which pins `ort` for result comparability) keeps using
    # the ONNX artifact above and there is no second model list to drift.
    mlx:
      slug: harrier-oss-v1-0.6b-MLX-4bit
      source: hf:majentik/harrier-oss-v1-0.6b-MLX-4bit

  - slug: harrier-oss-v1-270m-ONNX_model_q4f16
    family: harrier-oss-v1
    kind: embedder
    dim: 640
    max_context_window: 32768
    source: hf:onnx-community/harrier-oss-v1-270m-ONNX
    onnx_url: https://huggingface.co/onnx-community/harrier-oss-v1-270m-ONNX/resolve/main/onnx/model_q4f16.onnx
    mlx:
      slug: harrier-oss-v1-270m-MLX-4bit
      source: hf:majentik/harrier-oss-v1-270m-MLX-4bit

  # LLM evidence extractor
  - slug: qwen3-4b-instruct-2507-onnx-q4
    family: qwen-instruct
    kind: extractor
    dim: 0
    max_context_window: 4096
    source: hf:onnx-community/Qwen3-4B-Instruct-2507-ONNX
    onnx_url: https://huggingface.co/onnx-community/Qwen3-4B-Instruct-2507-ONNX/resolve/main/onnx/model_q4.onnx

  - slug: bge-reranker-v2-m3
    family: bge-reranker-v2-m3
    kind: reranker
    dim: 0
    max_context_window: 8192
    source: hf:onnx-community/bge-reranker-v2-m3-ONNX
    onnx_url: https://huggingface.co/onnx-community/bge-reranker-v2-m3-ONNX/resolve/main/onnx/model_quantized.onnx

  - slug: jina-reranker-v1-tiny-en
    family: jina-reranker-v1-tiny-en
    kind: reranker
    dim: 0
    max_context_window: 512
    source: hf:jinaai/jina-reranker-v1-tiny-en
    onnx_url: https://huggingface.co/jinaai/jina-reranker-v1-tiny-en/resolve/main/onnx/model.onnx

  - slug: granite-embedding-311m-multilingual-r2
    family: granite-embedding-311m-multilingual-r2
    kind: embedder
    dim: 768
    max_context_window: 32768
    source: hf:ibm-granite/granite-embedding-311m-multilingual-r2
    onnx_url: https://huggingface.co/ibm-granite/granite-embedding-311m-multilingual-r2/resolve/main/onnx/model.onnx

  - slug: granite-embedding-311m-multilingual-r2__model__quint8_avx2
    family: granite-embedding-311m-multilingual-r2
    kind: embedder
    dim: 768
    max_context_window: 32768
    source: hf:ibm-granite/granite-embedding-311m-multilingual-r2
    onnx_url: https://huggingface.co/ibm-granite/granite-embedding-311m-multilingual-r2/resolve/main/onnx/model_quint8_avx2.onnx

  - slug: mlateon
    family: mlateon
    kind: embedder
    dim: 128
    max_context_window: 8192
    source: hf:lightonai/mLateOn
    onnx_url: https://huggingface.co/lightonai/mLateOn/resolve/main/model.onnx
    multi_vector: true

  - slug: mlateon__model__int8
    family: mlateon
    kind: embedder
    dim: 128
    max_context_window: 8192
    source: hf:lightonai/mLateOn
    onnx_url: https://huggingface.co/lightonai/mLateOn/resolve/main/model_int8.onnx
    multi_vector: true

  # --- Additional fast multilingual embedders ---
  - slug: multilingual-e5-small
    family: multilingual-e5-small
    kind: embedder
    dim: 384
    max_context_window: 512
    source: hf:intfloat/multilingual-e5-small
    onnx_url: https://huggingface.co/intfloat/multilingual-e5-small/resolve/main/onnx/model.onnx

  - slug: paraphrase-multilingual-MiniLM-L12-v2
    family: paraphrase-multilingual-MiniLM-L12-v2
    kind: embedder
    dim: 384
    max_context_window: 128
    source: hf:sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    onnx_url: https://huggingface.co/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/onnx/model.onnx

  - slug: snowflake-arctic-embed-xs
    family: snowflake-arctic-embed-xs
    kind: embedder
    dim: 384
    max_context_window: 512
    source: hf:Snowflake/snowflake-arctic-embed-xs
    onnx_url: https://huggingface.co/Snowflake/snowflake-arctic-embed-xs/resolve/main/onnx/model_int8.onnx

  - slug: snowflake-arctic-embed-s
    family: snowflake-arctic-embed-s
    kind: embedder
    dim: 384
    max_context_window: 512
    source: hf:Snowflake/snowflake-arctic-embed-s
    onnx_url: https://huggingface.co/Snowflake/snowflake-arctic-embed-s/resolve/main/onnx/model.onnx

  - slug: snowflake-arctic-embed-m-v2.0
    family: snowflake-arctic-embed-m-v2.0
    kind: embedder
    dim: 768
    max_context_window: 8192
    source: hf:Snowflake/snowflake-arctic-embed-m-v2.0
    onnx_url: https://huggingface.co/Snowflake/snowflake-arctic-embed-m-v2.0/resolve/main/onnx/model.onnx

  - slug: granite-embedding-97M-Multilingual-R2
    family: granite-embeding-97M-Multilingual-R2
    kind: embedder
    dim: 384
    max_context_window: 8192
    source: hf:ibm-granite/granite-embedding-97M-Multilingual-R2
    onnx_url: https://huggingface.co/ibm-granite/granite-embedding-97M-Multilingual-R2/resolve/main/onnx/model.onnx

  - slug: amaretto-embed-148m-ONNX
    family: amaretto-embed-148m
    kind: embedder
    dim: 384
    max_context_window: 512
    source: hf:AmarettoLabs/amaretto-embed-148m-ONNX
    onnx_url: https://huggingface.co/AmarettoLabs/amaretto-embed-148m-ONNX/resolve/main/model.onnx

  - slug: multilingual-e5-base
    family: multilingual-e5-base
    kind: embedder
    dim: 768
    max_context_window: 512
    source: hf:intfloat/multilingual-e5-base
    onnx_url: https://huggingface.co/intfloat/multilingual-e5-base/resolve/main/onnx/model.onnx

  - slug: embeddinggemma-300m-ONNX
    family: embeddinggemma-300m
    kind: embedder
    dim: 768
    max_context_window: 2048
    source: hf:thoratsr7/embeddinggemma-300m-ONNX
