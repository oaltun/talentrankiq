    kind: embedder
    dim: 1024
    max_context_window: 32768
    source: hf:onnx-community/harrier-oss-v1-0.6b-ONNX
    artifacts:
      - backend: ort
        url: https://huggingface.co/onnx-community/harrier-oss-v1-0.6b-ONNX/resolve/main/onnx/model_q4.onnx
        sha256: null
        extra_files:
