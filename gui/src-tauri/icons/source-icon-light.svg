<!-- Shortlist app icon, light variant: white squircle background, like QuickTime.
     Derived from source-icon.svg (the dark original, which carries a C2PA content
     credential that this edit invalidates). Three changes from the dark original:
       background  dark -> white
       top bar     cold cyan -> warm reddish-orange (4.3:1 on white)
       lower bars  light grey -> deeper neutral grey (4.6:1 on white)
     The foreground hues were deepened because the originals fall to roughly 1.8:1
     and 3.2:1 on a white field and would look washed out.
     Regenerate the whole set with:
       npm run tauri icon src-tauri/icons/source-icon-light.svg -->
