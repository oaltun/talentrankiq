# Watch Rust sources and run a fast `cargo check` on every change.
#
# Why: `tauri dev` only rebuilds Rust when sources change, and on a compile error it
# silently keeps the previously-built binary running — so the GUI can be serving stale
# code while you think your edit is live. Running `cargo check` here, on each save,
# gives a red/green signal in seconds (fail-fast) AND warms the shared `target/` cache
# so the later `tauri dev` launch relinks quickly instead of compiling from scratch.
#
# Run alongside `npm run tauri:dev`:
#   cd src-tauri && watchexec
# (or from the repo root: `npm run rust:watch`)

# Watch Rust sources + manifests. `target/` is ignored so the rebuild loop doesn't
# re-trigger on its own output.
watch = ["src/**/*.rs", "Cargo.toml", "Cargo.lock"]
ignore = ["target/**"]

# `cargo check` is the fast "is it even valid?" pass (no codegen). Keep it quiet on
# success and surface only errors, so a green build is visually silent.
command = ["sh", "-c", "cargo check 2>&1 | grep -E '^error|^warning: unused' || true"]

# Cancel an in-flight check when another save lands, then run once at the end.
clear = true
on-busy-update = "restart"
