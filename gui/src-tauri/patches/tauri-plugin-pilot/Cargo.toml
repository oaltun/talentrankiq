[package]
name = "tauri-plugin-pilot"
version = "0.8.1"
edition = "2024"
license = "MIT"
rust-version = "1.95.0"
authors = ["Mathieu Piton <contact@mathieu-piton.com>"]
repository = "https://github.com/mpiton/tauri-pilot"
homepage = "https://github.com/mpiton/tauri-pilot"
description = "Tauri v2 plugin for runtime UI testing and automation via IPC JSON-RPC"
keywords = ["tauri", "plugin", "testing", "automation", "accessibility"]
categories = ["development-tools::testing", "gui"]
readme = "README.md"
links = "tauri-plugin-pilot"

[lints]
# workspace = true

[features]
default = ["press"]
press = ["dep:enigo"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.127"
tokio = { version = "1.44", features = ["net", "rt", "sync", "time", "io-util", "signal"] }
tracing = "0.1.41"
thiserror = "2"
tauri = { version = "2.12.1", features = ["unstable"] }
enigo = { version = "0.6.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os="linux")'.dependencies]
enigo = { version = "0.6.1", features = ["wayland"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
image = { version = "0.25.2", default-features = false, features = ["png"] }

[dev-dependencies]
serial_test = "4"
tauri = { version = "2.12.1", features = ["test"] }
tokio = { version = "1.44", features = ["test-util", "macros"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }