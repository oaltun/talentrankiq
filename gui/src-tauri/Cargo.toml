[package]
name = "triqui"
version = "0.1.0"
description = "Privacy-first desktop tool for ranking applicant CVs against a job ad and configurable criteria using on-device AI."
authors = ["oaltun"]
edition = "2021"
rust-version = "1.82"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)', 'cfg(desktop)'] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-global-shortcut = "2"
log = "0.4"

# Bundled benchmark CVs at compile time (extracted to the app-data dir for
# the serve process's `try_model`)
include_dir = "0.7"

# Type-safe Tauri command bindings
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["typescript"] }
specta-typescript = "=0.0.9"

# The gui's domain links: contract lib for the protocol (envelope, params,
# DTOs, client) plus the proxy lib hosting the serve loop, which the gui runs
# in-process (one binary, no child at all: the engine runs libmodelcaller as a
# library, and the ORT wrapper runs in-process on a dedicated thread) — thin
# gui pattern, `gui/design/app1/thin-gui.md`.
libtriqui-client = { path = "../../lib/libtriqui-client" }
libtriqui-cli = { path = "../../lib/libtriqui-cli" }
libtriqui-license = { path = "../../lib/libtriqui-license" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

# macOS-only: NSPanel for native panel behavior (fullscreen overlay, click-outside dismiss)
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

# Keep dev builds (tauri dev, cargo test) small on disk: full DWARF debuginfo
# makes target/debug grow to many GB. Line tables still give file/line info in
# backtraces; drop to `debug = false` if even that is too much.
# (profile.dev is set at the workspace root: talentrankiq/Cargo.toml)

[dev-dependencies]
# A few workflows assert on rows the serve contract does not expose (the
# persisted ad path, the cached model list). Test-only: never linked into the
# shipped binary.
rusqlite = { version = "0.32", features = ["bundled"] }
# the e2e workflows read the serve config the way the app does
libconfigreader = { path = "../../lib/libconfigreader" }
