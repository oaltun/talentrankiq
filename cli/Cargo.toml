[package]
name = "cli"
version = "0.1.0"
edition = "2021"
description = "Headless CLI for TalentRankIQ — JSONL event loop over stdio"
license = "Apache-2.0"

[[bin]]
name = "triq"
path = "src/main.rs"

[dependencies]
libtriqui-cli = { path = "../lib/libtriqui-cli" }
libtriqui-core = { path = "../lib/libtriqui-core" }
libconfigreader = { path = "../lib/libconfigreader" }
libtriqui-license = { path = "../lib/libtriqui-license" }
libmodeldownloader = { path = "../lib/libmodeldownloader" }
log = "0.4"
env_logger = "0.11"
dirs = "6"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
serde_yaml = "0.9"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
libtriqui-client = { path = "../lib/libtriqui-client" }
libmodelstorage = { path = "../lib/libmodelstorage" }
tempfile = "3.8"