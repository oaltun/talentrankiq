[package]
name = "libtriqui-client"
version = "0.1.0"
description = "Client side of the gui<->libtriqui-cli stdio-JSONL protocol contract: envelope, DTOs, command params, and spawn/call client. Both the Tauri gui and libtriqui-cli depend on it so the contract cannot drift (contract-lib pattern, NOAI.md)."
authors = ["oaltun"]
edition = "2021"
rust-version = "1.82"

[dependencies]
libcli-client = { path = "../libcli-client" }
regex = "1"