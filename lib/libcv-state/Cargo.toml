[package]
name = "libcv-state"
version = "0.1.0"
description = "Reducer + event log + projections for TalentRankIQ."
authors = ["oaltun"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "libcv_state"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
libcv-core = { path = "../libcv-core" }
libjudge = { path = "../libjudge" }