[package]
name = "libcv-comparator-order"
version = "0.1.0"
description = "Pair-picking strategy for head-to-head judging (Glicko-based)."
authors = ["oaltun"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "libcv_comparator_order"

[dependencies]
serde = { version = "1", features = ["derive"] }
libcv-core = { path = "../libcv-core" }
libcomparator = { path = "../libcomparator" }