[package]
name = "libcli-client-types"
version = "0.1.0"
description = "Wire protocol types for libcli-client with specta derives for JSON Schema and TypeScript export"
authors = ["oaltun"]
edition = "2021"
rust-version = "1.82"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json", "export"] }
schemars = { version = "0.8", features = ["derive"] }