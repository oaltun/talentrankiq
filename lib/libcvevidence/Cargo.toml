[package]
name = "libcvevidence"
version = "0.1.0"
edition = "2021"
description = "CvEvidence schema contract (base v1 + job-ad extensions) and ExtractionSchema types. Produced by libcvparser (stage A), consumed by libjudge/bench."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
