[package]
name = "libbenchresults"
version = "0.1.0"
edition = "2021"
description = "Shared library for writing and reading bench1 result YAML files and generating leaderboards."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
log = "0.4"