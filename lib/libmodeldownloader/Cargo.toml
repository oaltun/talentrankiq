[package]
name = "libmodeldownloader"
version = "0.1.0"
edition = "2021"
description = "ONNX model fetcher from HuggingFace (or file:// / https://), as a library. Consumers run it in-process — there is no libmodeldownloader binary."

[dependencies]
clap = { version = "4", features = ["derive"] }
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"
zip = "2"
tar = "0.4"
flate2 = "1"
libmodelstorage = { path = "../libmodelstorage" }
libconfigreader = { path = "../libconfigreader" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
