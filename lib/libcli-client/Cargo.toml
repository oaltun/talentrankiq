[package]
name = "libcli-client"
version = "0.1.0"
description = "JSONL wire protocol crate for triq CLI server. Defines the contract between clients and the triq serve loop. Exports JSON Schema and TypeScript bindings via specta."
authors = ["oaltun"]
edition = "2021"
rust-version = "1.82"

[dependencies]
libcli-client-types = { path = "../libcli-client-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
regex = "1"
thiserror = "2"
log = "0.4"

[build-dependencies]
libcli-client-types = { path = "../libcli-client-types" }
specta = { version = "=2.0.0-rc.22", features = ["export"] }
specta-typescript = "=0.0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"