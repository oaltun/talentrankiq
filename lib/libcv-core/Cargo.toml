[package]
name = "libcv-core"
version = "0.1.0"
description = "Core types for TalentRankIQ CV evaluation."
authors = ["oaltun"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "libcv_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
libtriqui-client = { path = "../libtriqui-client" }
