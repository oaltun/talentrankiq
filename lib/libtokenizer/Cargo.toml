[package]
name = "libtokenizer"
version = "0.1.0"
edition = "2021"
description = "HuggingFace tokenizer wrapper for text chunking. Loads tokenizer.json, counts tokens, splits text into token-aligned chunks."

[dependencies]
tokenizers = "0.21"
thiserror = "2"
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
